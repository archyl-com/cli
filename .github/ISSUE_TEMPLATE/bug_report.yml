name: Bug report
description: Something in archyl does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here, see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, what you got. Paste the output (remove tokens and private names).
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: archyl --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Archyl instance
      options: [archyl.com, Self-hosted]
  - type: textarea
    id: doctor
    attributes:
      label: archyl doctor
      description: Output of `archyl doctor`, if relevant.
      render: shell
